[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-backend"
version = "0.1.0"
description = "小红书文案生成后端（FastAPI + SQLAlchemy 2.x 同步模式）"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "XHS Team"},
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "SQLAlchemy>=2.0.25",
    "PyMySQL>=1.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyMySQL>=1.1",
]

[tool.setuptools.packages.find]
include = ["backend*", "app*"]
exclude = ["backend.tests*", "*.tests.*", "frontend*", "docs*"]
