[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-ai-content-generator-backend"
version = "0.1.0"
description = "FastAPI backend for image understanding and Xiaohongshu copy generation."
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0,<5.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pillow>=11.3,<13.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "PyMySQL>=1.1,<2.0",
    "SQLAlchemy>=2.0.25,<3.0",
    "typing-extensions>=4.12,<5.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
